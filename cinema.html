<!DOCTYPE html>

<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=Edge">
     <meta name="description" content="">
     <meta name="keywords" content="">
     <meta name="author" content="">
     <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

     <title>StaticHUN - Cinema</title>

     <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">

     <!-- Main css -->
     <link rel="stylesheet" href="assets/css/style-player.css">
     <link href="https://fonts.googleapis.com/css?family=Lora|Merriweather:300,400" rel="stylesheet">

</head>

<body>

     <!-- PRE LOADER -->
     <div class="preloader">
          <div class="sk-spinner sk-spinner-wordpress">
               <span class="sk-inner-circle"></span>
          </div>
     </div>
     
     <!-- Home Section -->
     <section id="home" class="main-home parallax-section">
          <div class="overlay"></div>
          <div id="particles-js"></div>
          <div class="container">
               <div class="row">

                    <div class="col-md-12 col-sm-12">
                         <form>
                              <div class="input-group mb-3">
                                   <input type="text" class="form-control" name="message">
                              </div>
                         </form>
                         <h4>Input ID or URL from Kinopoisk film/serial</h4>
                    </div>

               </div>
          </div>
     </section>

     <!-- SCRIPTS -->
     <script src="assets/js/jquery.js"></script>
     <script src="assets/js/particles.min.js"></script>
     <script src="assets/js/app.js"></script>
     <script src="assets/js/custom.js"></script>

     <script>
          document.forms.search.onsubmit = function() {
               const params = this.message.value;
               const KINOPOISK_ID = params.split('/')[4] || params;
               if (KINOPOISK_ID) {
                    const playerUrl = new URL(window.location.origin + 'player.html');
                    localStorage.setItem('film-id', KINOPOISK_ID);
                    window.open(playerUrl.toString(), 'displayWindow', 'width=680px,height=410px')
               }
               return false;
          };
     </script>

</body>

</html>
