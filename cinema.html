<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Online Movie Viewing on PC, TV, phone or tablet">
  <meta name="keywords" content="online,movie,film,viewing,free,kinopoisk,imdb">
  <meta name="author" content="Dmitry Sizov">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaticHUN - Cinema</title>
  <!-- Main css -->
  <link rel="stylesheet" href="assets/css/style-player.css">
  <link href="https://fonts.googleapis.com/css?family=Lora|Merriweather:300,400" rel="stylesheet"> </head>

<body>
<!-- Home Section -->
<div id="particles-js"></div>
<div class="container">
  <form name="search">
    <div class="input-group">
      <input type="text" placeholder="Input ID or URL from Kinopoisk/IMDb film/serial" class="form-control" name="message"> </div>
  </form>
</div>
<div class="player" id="kinobd"></div>
<!-- SCRIPTS -->
<script src="assets/js/particles.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const urlParams = new URLSearchParams(new URL(window.location.href).search);
  const params = urlParams.get('message');
  const filmId = params.split('/')[4] || params;

  if (typeof filmId !== 'null' && filmId.startsWith('tt')) {
    localStorage.removeItem('filmIdKinopoisk');
    localStorage.setItem('filmIdImdb', filmId.substring(2));
    console.log(filmId);

    document.getElementById('kinobd').dataset.player = "videospider";
    document.getElementById('kinobd').dataset.imdb = filmId;
  } else if (typeof filmId !== 'null') {
    localStorage.removeItem('filmIdImdb');
    localStorage.setItem('filmIdKinopoisk', filmId);
    console.log(filmId);

<!--    document.getElementById('kinobd').dataset.language = "en";-->
    document.getElementById('kinobd').dataset.kinopoisk = filmId;
  } else if (typeof localStorage.getItem('filmIdKinopoisk') !== 'null') {
<!--    document.getElementById('kinobd').dataset.language = "en";-->
    document.getElementById('kinobd').dataset.kinopoisk = localStorage.getItem('filmIdKinopoisk');
  } else if (typeof localStorage.getItem('filmIdImdb') !== 'null') {
    document.getElementById('kinobd').dataset.player = "videospider";
    document.getElementById('kinobd').dataset.imdb = localStorage.getItem('filmIdImdb');
  }

  document.forms.search.onsubmit = function() {
      location.reload();
  };
</script>
<script src="//kinobd.net/js/player_.js"></script>
</body>

</html>
